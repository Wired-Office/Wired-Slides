[package]
name = "wired-slides"
version = "1.0.0"
description = "Wired Slides for Windows and Linux"
authors = ["Wired Office"]
license = "MIT"
repository = "https://github.com/999david7/Wired-Slides"
edition = "2021"
rust-version = "1.77"

[lib]
name = "wired_slides_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
